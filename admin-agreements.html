<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاتفاقيات | Admin Agreements</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script>
if(!requireAuth(['admin'])) {}
else {
const l = State.lang;
const statusColors = {pending:'orange',active:'emerald',completed:'blue'};

const tableHtml = `<div class="table-wrap"><table>
  <thead><tr>
    <th>${l==='ar'?'الأصل':'Asset'}</th>
    <th>${l==='ar'?'المالك':'Owner'}</th>
    <th>${l==='ar'?'المشغّل':'Operator'}</th>
    <th>${l==='ar'?'المدة':'Period'}</th>
    <th>${l==='ar'?'العائد المالي':'Financial'}</th>
    <th>${l==='ar'?'العمولة':'Commission'}</th>
    <th>${l==='ar'?'الحالة':'Status'}</th>
  </tr></thead>
  <tbody>${DB.agreements.map(ag=>`<tr>
    <td class="font-medium">${l==='ar'?ag.assetNameAr:ag.assetNameEn}</td>
    <td>${l==='ar'?ag.ownerNameAr:ag.ownerNameEn}</td>
    <td>${l==='ar'?ag.investorNameAr:ag.investorNameEn}</td>
    <td style="white-space:nowrap">${ag.startDate} → ${ag.endDate}</td>
    <td>${l==='ar'?ag.financialDescAr:ag.financialDescEn}</td>
    <td>${ag.commissionRate}%</td>
    <td>${badge(t('agreement.statuses.'+ag.status),statusColors[ag.status]||'gray')}</td>
  </tr>`).join('')}</tbody>
</table></div>`;

document.getElementById('root').innerHTML = `
<div class="dash-wrap">
  ${buildNavbar()}
  <div class="dash-body">
    ${buildSidebar('admin','admin-agreements.html')}
    <main class="main-content">
      <div class="flex items-center gap-3 mb-6">${svgIcon('file-text',20)} <h1 class="text-xl font-bold text-gray-900">${t('nav.agreements')}</h1></div>
      ${tableHtml}
    </main>
  </div>
</div>`;
}
</script>
</body>
</html>
