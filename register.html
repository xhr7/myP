<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | Register</title><link rel="stylesheet" href="style.css"></head>
<body style="background:var(--gray-50)">
<div id="root"></div>
<script src="app.js"></script>
<script>
document.getElementById('root').innerHTML = `
${buildNavbar()}
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem">
  <div style="width:100%;max-width:26rem">
    <div class="card shadow-sm" style="padding:2rem">
      <div class="text-center mb-6">
        <div style="width:4rem;height:2.75rem;margin:0 auto .75rem">${LOGO_SVG}</div>
        <h1 class="text-xl font-bold text-gray-900">${t('auth.registerTitle')}</h1>
      </div>
      <div id="err-box" class="error-box mb-4 hidden"></div>
      <form id="reg-form" class="space-y-4">
        <div>
          <label class="form-label">${t('auth.fullName')} *</label>
          <input id="f-name" class="form-input" placeholder="${t('auth.fullName')}" required>
        </div>
        <div>
          <label class="form-label">${t('auth.email')} *</label>
          <input id="f-email" class="form-input" type="email" placeholder="example@email.com" dir="ltr" required>
        </div>
        <div>
          <label class="form-label">${t('auth.phone')}</label>
          <input id="f-phone" class="form-input" placeholder="05xxxxxxxx" dir="ltr">
        </div>
        <div>
          <label class="form-label">${t('auth.password')} *</label>
          <input id="f-pw" class="form-input" type="password" dir="ltr" required>
        </div>
        <div>
          <label class="form-label">${t('auth.confirmPassword')}</label>
          <input id="f-pw2" class="form-input" type="password" dir="ltr">
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center" style="margin-top:.5rem">${t('auth.registerBtn')}</button>
      </form>
      <p class="text-sm text-gray-500 text-center mt-5">
        ${t('auth.hasAccount')} <a href="login.html" style="color:var(--emerald-600);font-weight:500">${t('auth.loginLink')}</a>
      </p>
      <p class="text-xs text-gray-400 text-center mt-2">${t('auth.demoHint')}</p>
    </div>
  </div>
</main>`;

document.getElementById('reg-form').addEventListener('submit', e => {
  e.preventDefault();
  const name  = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const pw    = document.getElementById('f-pw').value;
  if (!name || !email || !pw) {
    const el = document.getElementById('err-box');
    el.textContent = State.lang==='ar'?'يرجى ملء الحقول المطلوبة':'Please fill all required fields';
    el.classList.remove('hidden');
    return;
  }
  doRegister({ name, email });
  location.href = 'general-home.html';
});
</script>
</body>
</html>
