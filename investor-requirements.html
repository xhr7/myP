<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متطلبات الاستثمار | Requirements</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script>
if(!requireAuth(['investor'])) {}
else {
const l = State.lang;
document.getElementById('root').innerHTML = `
<div class="dash-wrap">
  ${buildNavbar()}
  <div class="dash-body">
    ${buildSidebar('investor','investor-requirements.html')}
    <main class="main-content">
      <div style="max-width:42rem">
        <div class="flex items-center gap-3 mb-6">${svgIcon('search',20)} <h1 class="text-xl font-bold text-gray-900">${t('nav.requirements')}</h1></div>
        <div id="req-success" class="hidden text-center py-10">
          <div style="color:var(--blue-500);margin-bottom:1rem">${svgIcon('cpu',48)}</div>
          <h2 class="text-xl font-bold text-gray-900 mb-2">${l==='ar'?'جارٍ تحليل متطلباتك':'Analyzing Your Requirements'}</h2>
          <p class="text-sm text-gray-500 mb-5">${l==='ar'?'الذكاء الاصطناعي يطابق متطلباتك مع الأصول المتاحة...':'AI is matching your requirements with available assets...'}</p>
          <a href="ai-matches.html" class="btn btn-blue">${t('nav.aiMatches')} →</a>
        </div>
        <form id="req-form" class="card space-y-5">
          <div>
            <label class="form-label">${l==='ar'?'نوع المشروع':'Project Type'} *</label>
            <input id="f-projtype" class="form-input" required placeholder="${l==='ar'?'مثال: صالون خارجي موسمي':'e.g. Seasonal Outdoor Lounge'}">
          </div>
          <div class="grid-2">
            <div><label class="form-label">${t('asset.regionLabel')}</label><input id="f-region" class="form-input" placeholder="${l==='ar'?'الرياض':'Riyadh'}"></div>
            <div><label class="form-label">${l==='ar'?'المساحة المطلوبة (م²)':'Required Size (sqm)'}</label><input id="f-size" type="number" class="form-input" dir="ltr" placeholder="3000"></div>
          </div>
          <div>
            <label class="form-label">${t('asset.facilitiesLabel')}</label>
            <div class="flex flex-wrap gap-2 mt-1">
              ${['water','electricity','storage','parking','restrooms','kitchen'].map(f=>`<button type="button" class="chip" onclick="this.classList.toggle('active')">${t('asset.facilities.'+f)}</button>`).join('')}
            </div>
          </div>
          <div>
            <label class="form-label">${l==='ar'?'مدة الاستثمار (بالسنوات)':'Investment Duration (years)'}</label>
            <input id="f-period" type="number" class="form-input" dir="ltr" placeholder="2" min="1">
          </div>
          <div>
            <label class="form-label">${l==='ar'?'الميزانية المتاحة (ريال)':'Available Budget (SAR)'}</label>
            <input id="f-budget" type="number" class="form-input" dir="ltr" placeholder="500000">
          </div>
          <div>
            <label class="form-label">${l==='ar'?'متطلبات إضافية':'Additional Requirements'}</label>
            <textarea id="f-notes" class="form-textarea" rows="3" placeholder="${l==='ar'?'أي متطلبات أخرى...':'Any other requirements...'}"></textarea>
          </div>
          <button type="submit" class="btn btn-blue w-full justify-center">${l==='ar'?'ابحث عن الأصل المناسب':'Find Matching Assets'} ${svgIcon('cpu',16)}</button>
        </form>
      </div>
    </main>
  </div>
</div>`;

document.getElementById('req-form').addEventListener('submit', e=>{
  e.preventDefault();
  const pt = document.getElementById('f-projtype').value.trim();
  if(!pt) return;
  document.getElementById('req-form').style.display='none';
  document.getElementById('req-success').classList.remove('hidden');
});
}
</script>
</body>
</html>
