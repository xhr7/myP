<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشاريع النشطة | Active Projects</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script>
if(!requireAuth(['owner'])) {}
else {
const u = State.user;
const projects = DB.projects.filter(p=>p.ownerId===u.id);
const l = State.lang;

const listHtml = projects.length===0
  ? `<div class="card-dashed">${svgIcon('rocket',32)}<p class="text-gray-400 mt-3">${t('common.noData')}</p></div>`
  : `<div class="space-y-4">${projects.map(p=>`
  <div class="card">
    <div class="flex justify-between items-start gap-3 mb-4">
      <div>
        <h3 class="font-semibold text-gray-900">${l==='ar'?p.projectTypeAr:p.projectTypeEn}</h3>
        <p class="text-sm text-gray-500 mt-0.5">${l==='ar'?p.assetNameAr:p.assetNameEn} · ${l==='ar'?p.investorNameAr:p.investorNameEn}</p>
      </div>
      ${badge(l==='ar'?'نشط':'Active','emerald')}
    </div>
    <div class="mb-4">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>${l==='ar'?'تقدم المشروع':'Project Progress'}</span>
        <span>${p.progressPercent}%</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${p.progressPercent}%"></div></div>
    </div>
    <div class="flex items-center gap-2 text-xs text-gray-400">${svgIcon('calendar',12)} ${p.startDate} → ${p.endDate}</div>
  </div>`).join('')}</div>`;

document.getElementById('root').innerHTML = `
<div class="dash-wrap">
  ${buildNavbar()}
  <div class="dash-body">
    ${buildSidebar('owner','active-projects.html')}
    <main class="main-content">
      <div class="flex items-center gap-3 mb-6">${svgIcon('rocket',20)} <h1 class="text-xl font-bold text-gray-900">${t('nav.activeProjects')}</h1></div>
      ${listHtml}
    </main>
  </div>
</div>`;
}
</script>
</body>
</html>
